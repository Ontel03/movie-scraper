<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VidSpark Embed</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #000; font-family: system-ui, sans-serif; color: #fff; overflow: hidden; }

#loader {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 28px; background: #000;
}
#loader-bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  transition: opacity .6s ease; opacity: 0;
}
.spinner {
  position: relative; z-index: 1;
  width: 72px; height: 72px;
  border: 5px solid rgba(255,255,255,.15);
  border-top-color: #fff; border-radius: 50%;
  animation: spin .9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loader-text { position: relative; z-index: 1; font-size: .95rem; color: rgba(255,255,255,.6); letter-spacing: .04em; text-shadow: 0 1px 4px #000; }

#player { position: fixed; inset: 0; display: none; background: #000; }
#player iframe { width: 100%; height: 100%; border: none; display: block; }

#usage {
  position: fixed; inset: 0; display: none; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  background: #000; gap: 10px;
}
#usage p { font-size: 1.05rem; color: rgba(255,255,255,.65); line-height: 2; }

#err {
  position: fixed; inset: 0; display: none; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; background: #000;
}
#err-title { font-size: 2.4rem; font-weight: 700; color: #fff; margin-bottom: 18px; }
#err-detail {
  position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
  font-size: .78rem; color: rgba(255,255,255,.35); white-space: nowrap;
  max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
}
</style>
</head>
<body>

<div id="loader">
  <div id="loader-bg"></div>
  <div class="spinner"></div>
  <div id="loader-text">Loading player...</div>
</div>

<div id="usage">
  <p>
    <span style="color:#fff;font-size:1.2rem">VidSpark Embed</span><br><br>
    <code style="color:rgba(255,255,255,.8)">?id=550</code> &nbsp;— movie<br>
    <code style="color:rgba(255,255,255,.8)">?id=456&amp;s=1&amp;e=1</code> &nbsp;— TV episode<br>
    <code style="color:rgba(255,255,255,.8)">?id=550&amp;theme=b2f11f</code> &nbsp;— custom theme
  </p>
</div>

<div id="err">
  <div id="err-title">Error Occurred</div>
  <div id="err-detail"></div>
</div>

<div id="player">
  <iframe id="frame" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>
</div>

<script>
var TMDB_KEY = '3a73619bbb8fc6d47742d1b5b2b707b5';

var p = new URLSearchParams(location.search);
var id = p.get('id'), s = p.get('s'), e = p.get('e'), theme = p.get('theme');

function showPlayer() {
  document.getElementById('loader').style.display = 'none';
  document.getElementById('player').style.display = 'block';
}

function showErr(msg) {
  document.getElementById('loader').style.display = 'none';
  document.getElementById('err').style.display = 'flex';
  document.getElementById('err-detail').textContent = msg || '';
}

function loadBackdrop(id, isTv) {
  var type = isTv ? 'tv' : 'movie';
  fetch('https://api.themoviedb.org/3/' + type + '/' + id + '?api_key=' + TMDB_KEY)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var img = d.backdrop_path || d.poster_path;
      if (!img) return;
      var url = 'https://wsrv.nl/?url=' + encodeURIComponent('https://image.tmdb.org/t/p/w1280' + img) + '&bg=black&blur=3';
      var bg = document.getElementById('loader-bg');
      var preload = new Image();
      preload.onload = function() { bg.style.backgroundImage = 'url(' + url + ')'; bg.style.opacity = '1'; };
      preload.src = url;
    })
    .catch(function() {});
}

// Listen for VidSpark postMessage events
window.addEventListener('message', function(ev) {
  if (!ev.data || ev.data.source !== 'vidspark-player') return;
  var frame = document.getElementById('frame');
  if (ev.source !== frame.contentWindow) return;
  if (ev.data.event === 'play' || ev.data.event === 'timeupdate') {
    // Player is active — hide loader if still showing
    if (document.getElementById('loader').style.display !== 'none') showPlayer();
  }
});

if (!id) {
  document.getElementById('loader').style.display = 'none';
  document.getElementById('usage').style.display = 'flex';
} else {
  loadBackdrop(id, !!s);
  var qs = s ? 'id='+id+'&s='+s+'&e='+(e||'1') : 'id='+id;
  if (theme) qs += '&theme=' + encodeURIComponent(theme);
  fetch('/api?' + qs)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.error) return showErr(d.error);
      var frame = document.getElementById('frame');
      frame.src = d.embedUrl;
      // Show player once iframe starts loading; VidSpark handles its own loader
      frame.addEventListener('load', showPlayer, { once: true });
    })
    .catch(function(err) { showErr(err.message); });
}
</script>
</body>
</html>
